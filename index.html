<!doctype html>
<html lang="es" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07060d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kazzly Library</title>
<style>
:root{--bg:#07060d;--card:#110d1c;--tx:#f4eefc;--mut:#9d90b8;--or:#ff7a1a;--or2:#ff9a40;--bd:#3a2a55;--glow:0 0 8px rgba(255,122,26,.7),0 0 22px rgba(255,122,26,.35);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 50% -100px,#2a1140 0,transparent 70%),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{position:relative;padding:22px 16px 26px;text-align:center;border-bottom:1px solid var(--or);box-shadow:0 4px 24px rgba(255,122,26,.25)}
h1{margin:0 0 14px;font-size:clamp(26px,5vw,38px);letter-spacing:1px;color:#fff;text-shadow:0 0 6px #fff,0 0 14px var(--or),0 0 34px var(--or)}
.search{max-width:900px;margin:0 auto;width:100%;display:block;padding:15px 22px;border-radius:999px;border:1.5px solid var(--or);font-size:17px;outline:none;background:#0d0a16;color:var(--tx);box-shadow:var(--glow)}
.search:focus{box-shadow:0 0 12px var(--or),0 0 34px rgba(255,122,26,.6)}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.item{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;background:var(--card);cursor:pointer;transition:.15s}
.item:hover{border-color:var(--or);box-shadow:var(--glow)}
.ic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#ff7a1a,#ff3d81);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;flex:none;box-shadow:0 0 12px rgba(255,122,26,.6)}
.mut{color:var(--mut);font-size:14px}
.btn{background:var(--or);color:#120800;border:0;border-radius:999px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:var(--glow)}
.btn:hover{background:var(--or2)}.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.o{background:transparent;color:var(--or);border:1.5px solid var(--or);box-shadow:none}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px}
@media(max-width:700px){.det{grid-template-columns:1fr}}
.box{border:1px solid var(--bd);border-radius:14px;padding:18px;background:var(--card)}
.ver{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
input,textarea{width:100%;padding:10px 12px;margin:4px 0;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#0d0a16;color:var(--tx)}
input:focus,textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 8px rgba(255,122,26,.5)}
a.back{color:var(--or);cursor:pointer;display:inline-block;margin-bottom:14px;text-shadow:0 0 8px var(--or)}
h3{margin:.2em 0 .6em}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:999px;border:1.5px solid var(--or);color:var(--or);background:transparent;font-weight:600;cursor:pointer;font-size:15px}
.tab.on{background:var(--or);color:#120800;box-shadow:var(--glow)}
.tag{display:inline-block;background:rgba(255,122,26,.15);color:var(--or2);border:1px solid var(--or);border-radius:999px;padding:1px 10px;font-size:12px;margin-left:6px}
.st{color:var(--or);letter-spacing:1px;text-shadow:0 0 8px rgba(255,122,26,.8)}
.pick span{font-size:28px;cursor:pointer;color:#3a2a55}.pick span.on{color:var(--or);text-shadow:0 0 10px var(--or)}
.rv{border-top:1px solid var(--bd);padding:10px 0}
img.ic{object-fit:cover;background:#000}
.vf{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:11px;font-weight:700;margin:0 4px;box-shadow:0 0 8px #1d9bf0}
.cr{color:#4cc3ff;font-size:12px}
.menu{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--or);background:#0d0a16;color:var(--or);font-size:24px;cursor:pointer;box-shadow:var(--glow)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(280px,80vw);background:#0d0a16;border-left:1px solid var(--or);box-shadow:-8px 0 30px rgba(255,122,26,.3);padding:calc(70px + env(safe-area-inset-top,0px)) 18px 18px;transform:translateX(105%);transition:transform .2s;z-index:10}
.drawer.on{transform:none}
.drawer button{display:block;width:100%;text-align:left;margin-bottom:10px}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;display:none}.veil.on{display:block}
</style>
</head>
<body>
<header><h1>📚 Kazzly Library</h1><input id="q" class="search" type="search" placeholder="Busca tu app… (ej: CapCut Pro)" autocomplete="off"></header>
<main id="app"></main>
<script src="apps.js"></script>
<script>
let S={apps:APPS},owner=/[?&]admin(=|&|$)/.test(location.search),art=null,cur=null,query='',tab='all',typeSel=null,db=null,uid=null,ownerId=null,mine={},R={},st=0;
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
const go=u=>{const l=safe(u);if(l)window.open(l,'_blank','noopener')};
function sure(b){if(b._s){clearTimeout(b._t);b._s=0;return true}b._s=1;b._o=b.textContent;b.textContent='¿Seguro? Pulsa otra vez';b._t=setTimeout(()=>{b._s=0;b.textContent=b._o},3000);return false}
window.alert=m=>{let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#110d1c;color:#f4eefc;border:1px solid #ff7a1a;border-radius:12px;padding:12px 18px;z-index:20;box-shadow:0 0 14px rgba(255,122,26,.6)';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)};
const stars=a=>'★'.repeat(Math.round(a))+'☆'.repeat(5-Math.round(a));
const ico=(a,big)=>/^(data:image\/|icons\/)/.test(a.icon||'')?`<img class="ic" ${big?'style="width:72px;height:72px"':''} src="${esc(a.icon)}" alt="">`:`<div class="ic" ${big?'style="width:72px;height:72px;font-size:32px"':''}>${esc(a.name[0]||'?').toUpperCase()}</div>`;
const types=()=>[...new Set(S.apps.map(a=>a.type).filter(Boolean))];
const popular=()=>S.apps.filter(a=>a.pop);
function card(a){return `<div class="item" data-id="${esc(a.id)}">${ico(a)}<div><b>${esc(a.name)}</b>${a.type?`<span class="tag">${esc(a.type)}</span>`:''}<div class="mut">v${esc(a.versions[0]?.v||'-')}</div></div></div>`}
function resize(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,96,96);r(c.toDataURL('image/png'))};i.onerror=()=>r('');i.src=URL.createObjectURL(f)})}
function list(){
  cur=null;const t=query.trim().toLowerCase();let h='';
  if(t){const r=S.apps.filter(a=>a.name.toLowerCase().includes(t));h=r.map(card).join('')||'<p class="mut">No se encontró ninguna app.</p>'}
  else{
    h=`<div class="tabs">${[['all','📚 Todas'],['pop','🔥 Lo más popular'],['types','🗂 Tipos']].map(([k,l])=>`<button class="tab ${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>`;
    if(tab==='all')h+=S.apps.map(card).join('');
    else if(tab==='pop')h+=popular().map(card).join('')||'<p class="mut">Aún no hay apps populares.</p>';
    else{h+=`<div class="tabs">${types().map(x=>`<button class="tab ${typeSel===x?'on':''}" data-ty="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
      if(typeSel)h+=S.apps.filter(a=>a.type===typeSel).map(card).join('');else h+='<p class="mut">Elige un tipo.</p>'}
  }
  if(owner&&!t)h+=`<div class="box" style="margin-top:20px"><h3>➕ Nueva app (solo tú ves esto)</h3><input id="na" placeholder="Nombre"><textarea id="nd" rows="3" placeholder="Descripción"></textarea><input id="nt" list="tl" placeholder="Tipo (ej: Apps de edición, Videojuegos)"><datalist id="tl">${types().map(x=>`<option value="${esc(x)}">`).join('')}</datalist><label class="mut"><input type="checkbox" id="np" style="width:auto"> Mostrar en Lo más popular</label><div class="mut" style="margin-top:6px">Logo (PNG/JPG):</div><input type="file" id="ni" accept="image/*"><input id="nv" placeholder="Versión (ej: 1.0.0)"><input id="ns" placeholder="Tamaño (ej: 80 MB)"><input id="nu" placeholder="Link de descarga (https://…)"><button class="btn" id="add" style="margin-top:8px">Guardar y publicar</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.item').forEach(e=>e.onclick=()=>detail(e.dataset.id));
  app.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{tab=e.dataset.t;list()});
  app.querySelectorAll('[data-ty]').forEach(e=>e.onclick=()=>{typeSel=e.dataset.ty;list()});
  if(owner&&!t)$('add').onclick=async()=>{const n=$('na').value.trim();if(!n)return;const f=$('ni').files[0];
    S.apps.unshift({id:'a'+Date.now(),name:n,desc:$('nd').value.trim(),type:$('nt').value.trim(),pop:$('np').checked,icon:f?await resize(f):'',versions:[{v:$('nv').value.trim()||'1.0',size:$('ns').value.trim(),url:$('nu').value.trim()}]});save()};
}
function detail(id){
  cur=id;const a=S.apps.find(x=>x.id===id);if(!a)return list();const v=a.versions[0];
  app.innerHTML=`<a class="back" id="bk">← Volver</a><div class="det"><div class="box">${ico(a,1)}<h2 style="margin:.4em 0 .1em">${esc(a.name)}</h2><div class="mut">${a.type?esc(a.type)+' · ':''}${v?'v'+esc(v.v)+' · '+esc(v.size):''}</div><p><button class="btn" id="dl" ${safe(v?.url)?'':'disabled'}>⬇ Descargar</button></p><h3>Versiones</h3>${a.versions.map((x,i)=>`<div class="ver"><span>v${esc(x.v)} <span class="mut">${esc(x.size)}</span></span><button class="btn o" data-i="${i}">Descargar</button></div>`).join('')}${owner?`<div style="margin-top:14px"><b>➕ Nueva versión</b><input id="vv" placeholder="Versión"><input id="vs" placeholder="Tamaño"><input id="vu" placeholder="Link https://…"><button class="btn" id="av">Añadir</button><hr><b>✏️ Editar</b><input id="et" list="tl2" value="${esc(a.type)}" placeholder="Tipo"><datalist id="tl2">${types().map(x=>`<option value="${esc(x)}">`).join('')}</datalist><label class="mut"><input type="checkbox" id="ep" style="width:auto" ${a.pop?'checked':''}> Mostrar en Lo más popular</label><div class="mut">Cambiar logo:</div><input type="file" id="ei" accept="image/*"><button class="btn" id="se">Guardar cambios</button> <button class="btn o" id="del">Borrar app</button></div>`:''}</div><div><div class="box"><h3>Descripción</h3><p style="white-space:pre-wrap;line-height:1.55">${esc(a.desc)||'<span class=mut>Sin descripción.</span>'}</p></div></div></div>`;
  $('bk').onclick=()=>list();$('dl').onclick=()=>go(v.url);
  app.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>go(a.versions[b.dataset.i].url));
  if(owner){$('av').onclick=()=>{const n=$('vv').value.trim();if(!n)return;a.versions.unshift({v:n,size:$('vs').value.trim(),url:$('vu').value.trim()});save()};
    $('se').onclick=async()=>{a.type=$('et').value.trim();a.pop=$('ep').checked;const f=$('ei').files[0];if(f)a.icon=await resize(f);save()};
    $('del').onclick=e=>{if(sure(e.currentTarget)){S.apps=S.apps.filter(x=>x.id!==id);save()}}}
}
function save(){try{localStorage.setItem('kz_draft',JSON.stringify(S.apps))}catch(e){}cur?detail(cur):list();alert('Guardado en este navegador. Pulsa "Descargar apps.js" y súbelo a GitHub para que todos lo vean.')}
function bar(){const b=document.createElement('div');b.style.cssText='background:#1a1030;border-bottom:1px solid #ff7a1a;padding:10px 14px;text-align:center;font-size:14px';
  b.innerHTML='🔧 Modo administrador · <button class="btn" id="dla" style="padding:6px 14px;font-size:14px">⬇ Descargar apps.js</button> <button class="btn o" id="rst" style="padding:6px 14px;font-size:14px">Descartar cambios</button>';document.body.prepend(b);
  $('dla').onclick=()=>{const t='const APPS='+JSON.stringify(S.apps,null,2)+';\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));a.download='apps.js';a.click()};
  $('rst').onclick=e=>{if(!sure(e.currentTarget))return;try{localStorage.removeItem('kz_draft')}catch(x){}location.reload()}}
$('q').oninput=e=>{query=e.target.value;list()};
if(owner){try{const d=localStorage.getItem('kz_draft');if(d)S.apps=JSON.parse(d)}catch(e){}bar()}
list();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>


</body></html>
