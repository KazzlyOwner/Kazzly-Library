<!doctype html>
<html lang="es" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07060d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kazzly Library</title>
<style>
:root{--bg:#07060d;--card:#110d1c;--tx:#f4eefc;--mut:#9d90b8;--or:#ff7a1a;--or2:#ff9a40;--bd:#3a2a55;--glow:0 0 8px rgba(255,122,26,.7),0 0 22px rgba(255,122,26,.35);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 50% -100px,#2a1140 0,transparent 70%),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{position:relative;padding:22px 16px 26px;text-align:center;border-bottom:1px solid var(--or);box-shadow:0 4px 24px rgba(255,122,26,.25)}
h1{margin:0 0 14px;font-size:clamp(26px,5vw,38px);letter-spacing:1px;color:#fff;text-shadow:0 0 6px #fff,0 0 14px var(--or),0 0 34px var(--or)}
.search{max-width:900px;margin:0 auto;width:100%;display:block;padding:15px 22px;border-radius:999px;border:1.5px solid var(--or);font-size:17px;outline:none;background:#0d0a16;color:var(--tx);box-shadow:var(--glow)}
.search:focus{box-shadow:0 0 12px var(--or),0 0 34px rgba(255,122,26,.6)}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.item{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;background:var(--card);cursor:pointer;transition:.15s}
.item:hover{border-color:var(--or);box-shadow:var(--glow)}
.ic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#ff7a1a,#ff3d81);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;flex:none;box-shadow:0 0 12px rgba(255,122,26,.6)}
.mut{color:var(--mut);font-size:14px}
.btn{background:var(--or);color:#120800;border:0;border-radius:999px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:var(--glow)}
.btn:hover{background:var(--or2)}.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.o{background:transparent;color:var(--or);border:1.5px solid var(--or);box-shadow:none}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px}
@media(max-width:700px){.det{grid-template-columns:1fr}}
.box{border:1px solid var(--bd);border-radius:14px;padding:18px;background:var(--card)}
.ver{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
input,textarea{width:100%;padding:10px 12px;margin:4px 0;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#0d0a16;color:var(--tx)}
input:focus,textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 8px rgba(255,122,26,.5)}
a.back{color:var(--or);cursor:pointer;display:inline-block;margin-bottom:14px;text-shadow:0 0 8px var(--or)}
h3{margin:.2em 0 .6em}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:999px;border:1.5px solid var(--or);color:var(--or);background:transparent;font-weight:600;cursor:pointer;font-size:15px}
.tab.on{background:var(--or);color:#120800;box-shadow:var(--glow)}
.tag{display:inline-block;background:rgba(255,122,26,.15);color:var(--or2);border:1px solid var(--or);border-radius:999px;padding:1px 10px;font-size:12px;margin-left:6px}
.st{color:var(--or);letter-spacing:1px;text-shadow:0 0 8px rgba(255,122,26,.8)}
.pick span{font-size:28px;cursor:pointer;color:#3a2a55}.pick span.on{color:var(--or);text-shadow:0 0 10px var(--or)}
.rv{border-top:1px solid var(--bd);padding:10px 0}
img.ic{object-fit:cover;background:#000}
.vf{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:11px;font-weight:700;margin:0 4px;box-shadow:0 0 8px #1d9bf0}
.cr{color:#4cc3ff;font-size:12px}
.menu{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--or);background:#0d0a16;color:var(--or);font-size:24px;cursor:pointer;box-shadow:var(--glow)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(280px,80vw);background:#0d0a16;border-left:1px solid var(--or);box-shadow:-8px 0 30px rgba(255,122,26,.3);padding:calc(70px + env(safe-area-inset-top,0px)) 18px 18px;transform:translateX(105%);transition:transform .2s;z-index:10}
.drawer.on{transform:none}
.drawer button{display:block;width:100%;text-align:left;margin-bottom:10px}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;display:none}.veil.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.item{animation:rise .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms);transition:transform .2s,border-color .2s,box-shadow .2s}
.item:hover{transform:translateY(-3px)}
.det>.box,.det>div{animation:slide .4s cubic-bezier(.2,.8,.2,1) both}.det>div{animation-delay:.08s}
main>p.mut{animation:fade .3s both}
.tab{transition:background .25s,color .25s,box-shadow .25s,transform .15s}.tab:hover{transform:translateY(-2px)}.tab:active,.btn:active{transform:scale(.96)}
.btn{transition:background .2s,transform .15s,box-shadow .2s}
.ver{transition:background .2s}.ver:hover{background:rgba(255,122,26,.06)}
.search{transition:box-shadow .3s,transform .3s}.search:focus{transform:scale(1.01)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.irow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--bd)}.irow span{color:var(--mut)}.irow b{text-align:right}
.gal{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.sh{position:relative;flex:none}
.sh img{height:210px;display:block;border-radius:12px;border:1px solid var(--bd);cursor:zoom-in;transition:transform .2s,box-shadow .2s}.sh img:hover{transform:scale(1.02);box-shadow:var(--glow)}
.sh button{position:absolute;top:6px;right:6px;padding:2px 10px;font-size:13px;background:#0d0a16}
.fl{margin:0;padding-left:20px;line-height:1.65}.fl li::marker{color:var(--or)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:30;display:grid;place-items:center;cursor:zoom-out;animation:fade .2s both}.lb img{max-width:94vw;max-height:90vh;border-radius:12px;box-shadow:var(--glow)}
.stats{display:flex;margin:14px 0 6px;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.sc{flex:1;padding:10px 6px;text-align:center;border-left:1px solid var(--bd);display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.sc:first-child{border-left:0}.sc.w{flex:1.5}.sc b{font-size:15px;overflow-wrap:anywhere}.sc small{color:var(--mut);font-size:12px}
.inf{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--or);background:transparent;color:var(--or);font-weight:700;font-size:12px;line-height:1;cursor:pointer;padding:0;vertical-align:middle;margin-left:4px;transition:box-shadow .2s,transform .15s}
.inf:hover{box-shadow:var(--glow)}.inf:active{transform:scale(.9)}
.pp{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:30;display:grid;place-items:center;padding:20px;animation:fade .2s both}
.pp>div{background:var(--card);border:1px solid var(--or);border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:var(--glow);animation:rise .3s both}
.pp h3{margin:0 0 8px}.pp p{margin:0;padding:10px 0;border-top:1px solid var(--bd);line-height:1.5}
.rw{margin-bottom:26px}.rh{display:flex;align-items:baseline;gap:10px;margin:0 2px 8px}.rh h3{margin:0;font-size:20px;text-shadow:0 0 10px rgba(255,122,26,.45)}
.rl{position:relative}
.rs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px 2px 14px;scrollbar-width:none}.rs::-webkit-scrollbar{display:none}
.tile{flex:none;width:118px;scroll-snap-align:start;text-align:center;cursor:pointer;padding:12px 8px;border:1px solid var(--bd);border-radius:14px;background:var(--card);animation:rise .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms);transition:transform .2s,border-color .2s,box-shadow .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--or);box-shadow:var(--glow)}
.tile .ic{width:72px;height:72px;margin:0 auto 8px;font-size:30px;border-radius:18px}
.tile b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile small{color:var(--mut);font-size:12px}
.ar{position:absolute;top:50%;margin-top:-26px;z-index:2;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--or);background:#0d0a16;color:var(--or);font-size:22px;line-height:1;cursor:pointer;display:none;box-shadow:var(--glow)}.ar.l{left:-10px}.ar.r{right:-10px}
@media (hover:hover) and (pointer:fine){.rl:hover .ar{display:block}}
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;margin:8px 10px 0;padding:12px 20px;border-radius:18px;display:flex;align-items:center}
.bar b{font-size:19px;letter-spacing:.5px;color:#fff;text-shadow:0 0 6px #fff,0 0 14px var(--or),0 0 26px var(--or)}
header{border-bottom:0;box-shadow:none;padding-top:26px}
h1{font-size:clamp(22px,4.6vw,34px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:19;background:rgba(14,10,24,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 12% 18%,rgba(255,122,26,.22),transparent 38%),radial-gradient(circle at 88% 62%,rgba(160,60,255,.24),transparent 42%),radial-gradient(circle at 30% 95%,rgba(255,61,129,.14),transparent 40%)}
.bar,.item,.tile,.box,.stats,.search,.tab,.pp>div,.ar{background:rgba(255,255,255,.055);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 8px 28px rgba(0,0,0,.35)}
.bar{background:rgba(255,255,255,.075)}
.tab.on{background:rgba(255,122,26,.85);color:#120800;border-color:rgba(255,255,255,.35);box-shadow:var(--glow)}
.tab{color:#fff}
.search{border:1.5px solid rgba(255,122,26,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),var(--glow)}
.search:focus{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 12px var(--or),0 0 34px rgba(255,122,26,.6)}
.pp>div{background:rgba(26,16,40,.7);border-color:rgba(255,122,26,.7)}
.item:hover,.tile:hover{border-color:var(--or);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),var(--glow)}
.ar{border-color:var(--or)}
.splash{display:block;margin:16px auto 0;max-width:92%;color:#ffe600;font-weight:800;font-size:15px;text-shadow:2px 2px 0 #3b3000,0 0 12px rgba(255,230,0,.45);transform:rotate(-3deg);animation:pulse 1.2s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(-3deg) scale(1.08)}}
#spi{max-width:420px;display:block;margin:12px auto 0;text-align:center}
.lg{width:32px;height:32px;border-radius:9px;object-fit:cover;margin-right:10px;filter:drop-shadow(0 0 6px rgba(255,122,26,.7))}
</style>
</head>
<body>
<div class="bar"><img id="lg" class="lg" alt="" hidden><b>Kazzly Library</b></div>
<header><h1>¡La mejor página de Link directo!</h1><input id="q" class="search" type="search" placeholder="Busca tu app… (ej: CapCut Pro)" autocomplete="off"><div id="sp" class="splash"></div></header>
<main id="app"></main>
<script src="apps.js"></script>
<script>
let S={apps:APPS},owner=/[?&]admin(=|&|$)/.test(location.search),art=null,cur=null,query='',tab='all',typeSel=null,db=null,uid=null,ownerId=null,mine={},R={},st=0;
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
const go=u=>{const l=safe(u);if(l)window.open(l,'_blank','noopener')};
function sure(b){if(b._s){clearTimeout(b._t);b._s=0;return true}b._s=1;b._o=b.textContent;b.textContent='¿Seguro? Pulsa otra vez';b._t=setTimeout(()=>{b._s=0;b.textContent=b._o},3000);return false}
window.alert=m=>{let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#110d1c;color:#f4eefc;border:1px solid #ff7a1a;border-radius:12px;padding:12px 18px;z-index:20;box-shadow:0 0 14px rgba(255,122,26,.6)';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)};
const stars=a=>'★'.repeat(Math.round(a))+'☆'.repeat(5-Math.round(a));
const ico=(a,big)=>/^(data:image\/|icons\/)/.test(a.icon||'')?`<img class="ic" ${big?'style="width:72px;height:72px"':''} src="${esc(a.icon)}" alt="">`:`<div class="ic" ${big?'style="width:72px;height:72px;font-size:32px"':''}>${esc(a.name[0]||'?').toUpperCase()}</div>`;
const types=()=>[...new Set(S.apps.map(a=>a.type).filter(Boolean))];
const popular=()=>S.apps.filter(a=>a.pop);
function card(a){return `<div class="item" data-id="${esc(a.id)}">${ico(a)}<div><b>${esc(a.name)}</b>${a.type?`<span class="tag">${esc(a.type)}</span>`:''}<div class="mut">v${esc(a.versions[0]?.v||'-')}</div></div></div>`}
function resize(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,96,96);r(c.toDataURL('image/png'))};i.onerror=()=>r('');i.src=URL.createObjectURL(f)})}
const okimg=x=>/^(data:image\/|shots\/|icons\/)/.test(x||'');
function shot(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,560/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.onerror=()=>r('');i.src=URL.createObjectURL(f)})}
const shots=async fs=>(await Promise.all([...fs].slice(0,6).map(shot))).filter(Boolean);
const fdate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?new Date(d+'T12:00:00').toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'}):(d||'');
function zoom(src){const o=document.createElement('div');o.className='lb';o.innerHTML='<img alt="">';o.firstChild.src=src;o.onclick=()=>o.remove();document.body.appendChild(o)}
function agepop(t,l){const o=document.createElement('div');o.className='pp';o.innerHTML='<div><h3></h3><div class="pl"></div><button class="btn" style="width:100%;margin-top:14px">Entendido</button></div>';o.querySelector('h3').textContent=t;const c=o.querySelector('.pl');l.forEach(x=>{const p=document.createElement('p');p.textContent=x;c.appendChild(p)});o.querySelector('button').onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o)}
const lines=t=>(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const tile=(a,i)=>`<div class="tile" data-id="${esc(a.id)}" style="--i:${Math.min(i,8)}">${ico(a)}<b>${esc(a.name)}</b><small>v${esc(a.versions[0]?.v||'-')}</small></div>`;
const rowH=(t,l)=>`<section class="rw"><div class="rh"><h3>${esc(t)}</h3><span class="mut">${l.length}</span></div><div class="rl"><button class="ar l" aria-label="Anterior">‹</button><div class="rs">${l.map(tile).join('')}</div><button class="ar r" aria-label="Siguiente">›</button></div></section>`;
function rows(){let h='';const p=popular();if(p.length)h+=rowH('🔥 Lo más popular',p);types().forEach(t=>h+=rowH(t,S.apps.filter(a=>a.type===t)));const o=S.apps.filter(a=>!a.type);if(o.length)h+=rowH('Otros',o);return h||'<p class="mut">Aún no hay apps.</p>'}
let SPL=typeof SPLASH==='string'?SPLASH:'',LG=typeof LOGO==='string'?LOGO:'';
function logo(){const e=$('lg');if(/^data:image\//.test(LG)){e.src=LG;e.hidden=false}else{e.hidden=true;e.removeAttribute('src')}}
function splash(){const e=$('sp');e.textContent=SPL;e.style.display=SPL?'block':'none'}
function list(){
  cur=null;const t=query.trim().toLowerCase();let h='';
  if(t){const r=S.apps.filter(a=>a.name.toLowerCase().includes(t));h=r.map(card).join('')||'<p class="mut">No se encontró ninguna app.</p>'}
  else{
    h=`<div class="tabs">${[['all','📚 Todas'],['pop','🔥 Lo más popular'],['types','🗂 Tipos']].map(([k,l])=>`<button class="tab ${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>`;
    if(tab==='all')h+=rows();
    else if(tab==='pop')h+=popular().map(card).join('')||'<p class="mut">Aún no hay apps populares.</p>';
    else{h+=`<div class="tabs">${types().map(x=>`<button class="tab ${typeSel===x?'on':''}" data-ty="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
      if(typeSel)h+=S.apps.filter(a=>a.type===typeSel).map(card).join('');else h+='<p class="mut">Elige un tipo.</p>'}
  }
  if(owner&&!t)h+=`<div class="box" style="margin-top:20px"><h3>➕ Nueva app (solo tú ves esto)</h3><input id="na" placeholder="Nombre"><textarea id="nd" rows="3" placeholder="Sobre la app (descripción)"></textarea><input id="nt" list="tl" placeholder="Tipo (ej: Apps de edición, Videojuegos)"><datalist id="tl">${types().map(x=>`<option value="${esc(x)}">`).join('')}</datalist><label class="mut"><input type="checkbox" id="np" style="width:auto"> Mostrar en Lo más popular</label><div class="mut" style="margin-top:6px">Logo (PNG/JPG):</div><input type="file" id="ni" accept="image/*"><input id="nde" placeholder="Desarrollador"><div class="mut" style="margin-top:6px">Última actualización:</div><input type="date" id="nup"><input id="nr" placeholder="Requerimientos (ej: Android 6.0+)"><div class="mut" style="margin-top:6px">Datos de Play Store:</div><input id="nrat" placeholder="Estrellas (ej: 4.5)"><input id="nrev" placeholder="Opiniones (ej: 4 M opiniones)"><input id="nage" placeholder="Edad (ej: Para mayores de 10 años)"><textarea id="nai" rows="3" placeholder="Detalle de la edad, una línea por dato (ej: Violencia de fantasía)"></textarea><input id="ndl" placeholder="Descargas (ej: Más de 50 M)"><textarea id="nf" rows="3" placeholder="Características (una por línea)"></textarea><div class="mut" style="margin-top:6px">Capturas de pantalla (hasta 6):</div><input type="file" id="nsh" accept="image/*" multiple><input id="nv" placeholder="Versión (ej: 1.0.0)"><input id="ns" placeholder="Tamaño (ej: 80 MB)"><input id="nu" placeholder="Link de descarga (https://…)"><button class="btn" id="add" style="margin-top:8px">Guardar y publicar</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.tile').forEach(e=>e.onclick=()=>detail(e.dataset.id));
  app.querySelectorAll('.ar').forEach(b=>b.onclick=()=>{const x=b.parentNode.querySelector('.rs');x.scrollBy({left:(b.classList.contains('l')?-1:1)*x.clientWidth*.8,behavior:'smooth'})});
  app.querySelectorAll('.item').forEach((e,i)=>{e.style.setProperty('--i',Math.min(i,8));e.onclick=()=>detail(e.dataset.id)});
  app.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{tab=e.dataset.t;list()});
  app.querySelectorAll('[data-ty]').forEach(e=>e.onclick=()=>{typeSel=e.dataset.ty;list()});
  if(owner&&!t)$('add').onclick=async()=>{const n=$('na').value.trim();if(!n)return;const f=$('ni').files[0];
    S.apps.unshift({id:'a'+Date.now(),name:n,desc:$('nd').value.trim(),type:$('nt').value.trim(),pop:$('np').checked,icon:f?await resize(f):'',dev:$('nde').value.trim(),upd:$('nup').value,req:$('nr').value.trim(),rat:$('nrat').value.trim(),revs:$('nrev').value.trim(),age:$('nage').value.trim(),ageinfo:$('nai').value.trim(),dls:$('ndl').value.trim(),feat:$('nf').value.trim(),shots:await shots($('nsh').files),versions:[{v:$('nv').value.trim()||'1.0',size:$('ns').value.trim(),url:$('nu').value.trim()}]});save()};
}
function detail(id){
  cur=id;const a=S.apps.find(x=>x.id===id);if(!a)return list();const v=a.versions[0];
  const ai=lines(a.ageinfo),cells=[];
  if(a.rat)cells.push(`<div class="sc"><b>${esc(a.rat)} <span class="st">★</span></b>${a.revs?`<small>${esc(a.revs)}</small>`:''}</div>`);
  if(a.age)cells.push(`<div class="sc w"><b>${esc(a.age)}${ai.length?' <button class="inf" id="ib" aria-label="Más información">!</button>':''}</b></div>`);
  if(a.dls)cells.push(`<div class="sc"><b>${esc(a.dls)}</b><small>Descargas</small></div>`);
  const stats=cells.length?`<div class="stats">${cells.join('')}</div>`:'';
  const rows=[['Desarrollador',a.dev],['Actualización',fdate(a.upd)],['Requerimientos',a.req]].filter(x=>x[1]);
  const info=rows.length?`<div class="box"><h3>Información</h3>${rows.map(x=>`<div class="irow"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}</div>`:'';
  const sh=(a.shots||[]).filter(okimg),gal=sh.length?`<div class="box" style="margin-top:16px"><h3>Capturas</h3><div class="gal">${sh.map((x,i)=>`<div class="sh"><img src="${esc(x)}" data-z="1" alt="">${owner?`<button class="btn o" data-r="${i}">✕</button>`:''}</div>`).join('')}</div></div>`:'';
  const fl=(a.feat||'').split('\n').map(x=>x.replace(/^[\s•*-]+/,'').trim()).filter(Boolean),feat=fl.length?`<div class="box" style="margin-top:16px"><h3>Características</h3><ul class="fl">${fl.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
  app.innerHTML=`<a class="back" id="bk">← Volver</a><div class="det"><div class="box">${ico(a,1)}<h2 style="margin:.4em 0 .1em">${esc(a.name)}</h2><div class="mut">${a.type?esc(a.type)+' · ':''}${v?'v'+esc(v.v)+' · '+esc(v.size):''}</div>${stats}<p><button class="btn" id="dl" ${safe(v?.url)?'':'disabled'}>⬇ Descargar</button></p><h3>Versiones</h3>${a.versions.map((x,i)=>`<div class="ver"><span>v${esc(x.v)} <span class="mut">${esc(x.size)}</span></span><span><button class="btn o" data-i="${i}">Descargar</button>${owner?` <button class="btn o" data-x="${i}" title="Borrar versión">🗑</button>`:''}</span></div>`).join('')}${owner?`<div style="margin-top:14px"><b>➕ Nueva versión</b><input id="vv" placeholder="Versión"><input id="vs" placeholder="Tamaño"><input id="vu" placeholder="Link https://…"><button class="btn" id="av">Añadir</button><hr><b>✏️ Editar</b><input id="et" list="tl2" value="${esc(a.type)}" placeholder="Tipo"><datalist id="tl2">${types().map(x=>`<option value="${esc(x)}">`).join('')}</datalist><input id="ed" value="${esc(a.dev)}" placeholder="Desarrollador"><div class="mut">Última actualización:</div><input type="date" id="eu" value="${esc(a.upd)}"><input id="er" value="${esc(a.req)}" placeholder="Requerimientos"><div class="mut">Datos de Play Store:</div><input id="erat" value="${esc(a.rat)}" placeholder="Estrellas (ej: 4.5)"><input id="erev" value="${esc(a.revs)}" placeholder="Opiniones (ej: 4 M opiniones)"><input id="eage" value="${esc(a.age)}" placeholder="Edad (ej: Para mayores de 10 años)"><textarea id="eai" rows="3" placeholder="Detalle de la edad, una línea por dato">${esc(a.ageinfo)}</textarea><input id="edl" value="${esc(a.dls)}" placeholder="Descargas (ej: Más de 50 M)"><textarea id="ef" rows="3" placeholder="Características (una por línea)">${esc(a.feat)}</textarea><textarea id="edsc" rows="3" placeholder="Sobre la app">${esc(a.desc)}</textarea><div class="mut">Añadir capturas (máx. 6 en total):</div><input type="file" id="esh" accept="image/*" multiple><label class="mut"><input type="checkbox" id="ep" style="width:auto" ${a.pop?'checked':''}> Mostrar en Lo más popular</label><div class="mut">Cambiar logo:</div><input type="file" id="ei" accept="image/*"><button class="btn" id="se">Guardar cambios</button> <button class="btn o" id="del">Borrar app</button></div>`:''}</div><div>${info}${gal}${feat}<div class="box" style="margin-top:16px"><h3>Sobre la app</h3><p style="white-space:pre-wrap;line-height:1.55">${esc(a.desc)||'<span class=mut>Sin descripción.</span>'}</p></div></div></div>`;
  $('bk').onclick=()=>list();$('dl').onclick=()=>go(v.url);
  app.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>go(a.versions[b.dataset.i].url));
  if($('ib'))$('ib').onclick=()=>agepop(a.age,ai);
  app.querySelectorAll('img[data-z]').forEach(im=>im.onclick=()=>zoom(im.src));
  app.querySelectorAll('button[data-r]').forEach(b=>b.onclick=e=>{if(!sure(e.currentTarget))return;a.shots.splice(+b.dataset.r,1);save()});
  if(owner){app.querySelectorAll('button[data-x]').forEach(b=>b.onclick=e=>{if(!sure(e.currentTarget))return;if(a.versions.length<2)return alert('Una app necesita al menos una versión');a.versions.splice(+b.dataset.x,1);save()});
    $('av').onclick=()=>{const n=$('vv').value.trim();if(!n)return;a.versions.unshift({v:n,size:$('vs').value.trim(),url:$('vu').value.trim()});save()};
    $('se').onclick=async()=>{a.type=$('et').value.trim();a.pop=$('ep').checked;a.dev=$('ed').value.trim();a.upd=$('eu').value;a.req=$('er').value.trim();a.rat=$('erat').value.trim();a.revs=$('erev').value.trim();a.age=$('eage').value.trim();a.ageinfo=$('eai').value.trim();a.dls=$('edl').value.trim();a.feat=$('ef').value.trim();a.desc=$('edsc').value.trim();if($('esh').files.length)a.shots=[...(a.shots||[]),...await shots($('esh').files)].slice(0,6);const f=$('ei').files[0];if(f)a.icon=await resize(f);save()};
    $('del').onclick=e=>{if(sure(e.currentTarget)){S.apps=S.apps.filter(x=>x.id!==id);save()}}}
}
function save(){try{localStorage.setItem('kz_draft',JSON.stringify(S.apps))}catch(e){}cur?detail(cur):list();alert('Guardado en este navegador. Pulsa "Descargar apps.js" y súbelo a GitHub para que todos lo vean.')}
function bar(){const b=document.createElement('div');b.style.cssText='background:#1a1030;border-bottom:1px solid #ff7a1a;padding:10px 14px;text-align:center;font-size:14px';
  b.innerHTML='🔧 Modo administrador · <button class="btn" id="dla" style="padding:6px 14px;font-size:14px">⬇ Descargar apps.js</button> <button class="btn o" id="rst" style="padding:6px 14px;font-size:14px">Descartar cambios</button>';document.body.prepend(b);
  $('dla').onclick=()=>{const t='const APPS='+JSON.stringify(S.apps,null,2)+';\nconst SPLASH='+JSON.stringify(SPL)+';\nconst LOGO='+JSON.stringify(LG)+';\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));a.download='apps.js';a.click()};
  $('rst').onclick=e=>{if(!sure(e.currentTarget))return;try{localStorage.removeItem('kz_draft');localStorage.removeItem('kz_splash');localStorage.removeItem('kz_logo')}catch(x){}location.reload()}}
$('q').oninput=e=>{query=e.target.value;list()};
if(owner){try{const d=localStorage.getItem('kz_draft');if(d)S.apps=JSON.parse(d);const z=localStorage.getItem('kz_splash');if(z!==null)SPL=z;const l=localStorage.getItem('kz_logo');if(l!==null)LG=l}catch(e){}bar();const i=document.createElement('input');i.id='spi';i.maxLength=60;i.placeholder='Mini texto amarillo (solo tú lo ves)';i.value=SPL;i.oninput=()=>{SPL=i.value;try{localStorage.setItem('kz_splash',SPL)}catch(e){}splash()};$('sp').after(i);
  const w=document.createElement('div'),lf=document.createElement('input'),lx=document.createElement('button');
  w.className='mut';w.style.cssText='text-align:center;margin-top:10px';w.append('Logo de la barra: ');
  lf.type='file';lf.accept='image/*';lf.style.cssText='width:auto;max-width:230px;display:inline-block;margin:0 6px';
  lf.onchange=async()=>{const f=lf.files[0];if(!f)return;LG=await resize(f);try{localStorage.setItem('kz_logo',LG)}catch(e){}logo()};
  lx.className='btn o';lx.textContent='Quitar';lx.style.cssText='padding:4px 12px;font-size:13px';
  lx.onclick=()=>{LG='';try{localStorage.setItem('kz_logo','')}catch(e){}logo()};
  w.append(lf,lx);i.after(w)}
splash();logo();
list();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>


</body></html>
